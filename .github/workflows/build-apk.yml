name: Build Android APK

# Builds an installable Android APK in the cloud (GitHub-hosted runners have the
# Android SDK and unrestricted network, so they can do what a sandbox can't).
#
# The Flutter template signs the *release* build with the debug key, so the
# resulting APK installs directly on a device — no signing secrets needed. This
# is meant for sideloading onto your own phone, not for the Play Store. See the
# note at the bottom for how to switch to a real upload key.

on:
  workflow_dispatch: {} # lets you run it on demand from the Actions tab
  push:
    branches:
      - main
      - claude/github-habit-tracker-designs-6qnvyy
    tags:
      - 'v*'

jobs:
  build-apk:
    name: Build release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build release APK (universal, installs on any device)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tapestry-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
